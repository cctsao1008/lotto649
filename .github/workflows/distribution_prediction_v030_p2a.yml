name: v0.30 P2A Distribution Prediction

on:
  push:
    paths:
      - 'lotto7x7/distribution_prediction_v030.py'
      - 'tests/test_distribution_prediction_v030_p2.py'
      - 'docs/distribution_prediction_v030_p2.md'
      - '.github/workflows/distribution_prediction_v030_p2a.yml'
  workflow_dispatch:

jobs:
  test-p2a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run v0.30 P0/P1/P2A regressions
        run: |
          python -m unittest discover -s tests -p 'test_distribution_dynamics_v030_p0.py' -v
          python -m unittest discover -s tests -p 'test_conditional_monte_carlo_v030_p1.py' -v
          python -m unittest discover -s tests -p 'test_distribution_prediction_v030_p2.py' -v
      - name: Run source-audited P2A smoke
        run: |
          python -m lotto7x7.distribution_prediction_v030 --start-draw 500 --step 10 --references 16 --iid-reps 3 --seed 649 --out results/v030_p2a_ci_smoke.json
          git diff --exit-code
