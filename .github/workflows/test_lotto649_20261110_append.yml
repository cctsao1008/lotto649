name: Lotto649 2026-11-10 #115000104 CSV BIN incremental integrity

on:
  pull_request:
    paths:
      - 'data/csv/lotto649_2026.csv'
      - 'data/bin/lotto649_history_v1.bin'
      - 'data/bin/lotto649_images_v2.bin'
      - 'data/bin/lotto649_source_manifest.json'
      - 'scripts/export_lotto649_csv.py'
      - 'tests/test_lotto649_append_20261110.py'
      - '.github/workflows/test_lotto649_20261110_append.yml'
  workflow_dispatch:

jobs:
  three-way-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest numpy scipy
      - name: Regression test CSV BIN integrity, original prefix seal and new draw prospective grading
        run: |
          python -m pytest -q \
            tests/test_export_lotto649_csv.py \
            tests/test_lotto649_append_20261110.py \
            tests/test_prospective_p3f_static10_v027.py
      - name: Verify 23 flat CSVs against history BIN and image BIN without overwriting
        run: python scripts/export_lotto649_csv.py --bin-dir data/bin --out-dir data/csv --verify
      - name: Evaluate first new draw from pinned 2497-draw P3f model without retraining
        run: |
          python -m lotto7x7.prospective_p3f_static10_v027 \
            --seal prospective/v027_p3f_static10_20261110_seal.json \
            --csv-dir data/csv \
            --out /tmp/v027_p3f_20261110_check.json \
            --md-out /tmp/v027_p3f_20261110_check.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/v027_p3f_20261110_check.json').read_text())
          assert r['observed_draws']==1 and r['pending_draws']==9
          assert r['earliest_missing_draw']==115000105
          assert r['final_exact_one_sided_binomial_tests'] is None
          assert r['status_per_draw'][0]['actual_main']==[11,23,30,32,40,41]
          assert r['status_per_draw'][0]['actual_bonus']==28
          assert r['source']['input_prefix_sha256']=='d865e1d241b607488e58a00b22fb595734f804595afd9d8850718808d6e8b7f8'
          print('[PASS] 1/10 observed from draw #115000104, 9/10 PENDING; immutable research SHA256 unchanged')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lotto649-115000104-bin-csv-p3f-audit
          path: |
            /tmp/v027_p3f_20261110_check.json
            /tmp/v027_p3f_20261110_check.md
          if-no-files-found: error
