name: M0 Strategy Verification v1.6 (Nested Candidate Pool Scaling)
on:
  push:
    paths:
      - 'lotto7x7/strategy_verification_v12.py'
      - 'lotto7x7/strategy_verification_v13.py'
      - 'lotto7x7/strategy_verification_v16.py'
      - 'tests/test_strategy_verification_v16.py'
      - '.github/workflows/strategy_verification_v16.yml'
  workflow_dispatch:
jobs:
  nested-pool-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Run deterministic nested-pool and small exhaustive tests
        run: python -m unittest discover -s tests -p 'test_strategy_verification_v16.py' -v
      - name: Full source-audited 2000/4000/8000/13704 nested experiment
        run: |
          python -m lotto7x7.strategy_verification_v16 --csv-root data/csv --bin-root data/bin --mip-seconds 6 --out results/strategy_v16_nested_pool_scaling.json
          python -c "import json; r=json.load(open('results/strategy_v16_nested_pool_scaling.json')); assert r['decision']=='NESTED_POOL_SCALING_AUDIT_PASS'; assert r['source']['v12_checks']==152; assert [x['size'] for x in r['arms']]==[2000,4000,8000,13704]; assert r['arms'][0]['full_lexicographic_optimality']=='V15_EXACT_FINITE_POOL_PASS'; assert all(x['primary_rigorous_upper']>=x['best_feasible_witness']['min_rank'] for x in r['arms']); print('PASS nested candidate quality audit')"
          git diff --exit-code
      - name: Archive source-gated quality and primary optimality bounds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v16-nested-pool-scaling
          path: results/strategy_v16_nested_pool_scaling.json
          retention-days: 30
          if-no-files-found: warn
