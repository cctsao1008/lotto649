name: M0 Strategy Verification v1.4 (Full Lexicographic Tie Break)
on:
  push:
    paths:
      - 'lotto7x7/strategy_verification_v14.py'
      - 'lotto7x7/strategy_verification_v12.py'
      - 'lotto7x7/strategy_verification_v13.py'
      - 'tests/test_strategy_verification_v14.py'
      - 'tests/fixtures/v028_m0_original_ci_golden_v12.json'
      - '.github/workflows/strategy_verification_v14.yml'
  workflow_dispatch:
jobs:
  audit-m0-lexicographic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: Prove exact dual bounds and MIP outcomes on tiny adversarial pools
        run: python -m unittest discover -s tests -p 'test_strategy_verification_v14.py' -v
      - name: Independently rebuild original M0 pool and audit lexicographic optimum
        run: |
          python -m lotto7x7.strategy_verification_v14 --csv-root data/csv --bin-root data/bin --mip-seconds 90 --out results/strategy_v14_m0_lexicographic.json
          python -c "import json; r=json.load(open('results/strategy_v14_m0_lexicographic.json')); assert r['v12_checks']==152; assert r['historical_draws']==2497; assert r['audit']['reduction']['frozen_primary_maximin']==43549; assert r['decision']=='ORIGINAL_PRIMARY_MAXIMIN_OPTIMAL_SECONDARY_SUBOPTIMAL'; assert r['audit']['original_total_rank_sum']==189817; assert r['audit']['secondary_total_rank']['solver']['objective_integer']==192715; assert r['audit']['tertiary_joint_rank']['solver']['objective_integer']==52895; assert r['audit']['secondary_total_rank']['strict_improvement_found']; assert r['audit']['secondary_total_rank']['certificate_basis']=='MIP_ZERO_GAP_NUMERICAL_ONLY'; assert r['audit']['tertiary_joint_rank']['certificate_basis']=='MIP_ZERO_GAP_NUMERICAL_ONLY'; print('AUDITED:',r['decision'])"
          git diff --exit-code
      - name: Preserve immutable audit and optimization certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-v14-m0-lexicographic
          path: results/strategy_v14_m0_lexicographic.json
          retention-days: 30
          if-no-files-found: warn
