name: M1 Experiment Ledger Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "research/lotto7x7/experiment_ledger.py"
      - "research/lotto7x7/experiment_runner.py"
      - "research/experiments/configs/**"
      - "research/tests/test_experiment_ledger_m1.py"
      - "research/experiments/ledger_registry_v1.json"
      - "research/docs/experiment_ledger_m1.md"
      - ".github/workflows/experiment_ledger_m1.yml"

permissions:
  contents: read

jobs:
  verify-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M1 regression tests and public anchor verification
        run: |
          python -m unittest discover -s research/tests -p 'test_experiment_ledger_m1.py' -v
          python -m lotto7x7.experiment_ledger verify
