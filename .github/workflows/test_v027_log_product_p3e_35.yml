name: v0.27 P3e full 35-checkpoint original-P2 replay
on:
  pull_request:
    paths:
      - "lotto7x7/log_product_p3d_legacy_replay_v027.py"
      - "lotto7x7/log_product_p3e_merge_v027.py"
      - "tests/test_log_product_p3e_merge_v027.py"
      - ".github/workflows/test_v027_log_product_p3e_35.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest numpy
      - name: Run P3e and cumulative P0-P3d tests
        run: |
          python -m py_compile lotto7x7/log_product_p3d_legacy_replay_v027.py lotto7x7/log_product_p3e_merge_v027.py
          python -m pytest -q \
            tests/test_distribution_repair_v027.py tests/test_distribution_repair_scoring_v027.py \
            tests/test_distribution_repair_portfolio_v027.py tests/test_log_product_v027.py \
            tests/test_log_product_dual_scoring_v027.py tests/test_log_product_dual_portfolio_v027.py \
            tests/test_log_product_joint_p3_v027.py tests/test_log_product_p3b_pilot_v027.py \
            tests/test_log_product_p3c_exact_iid_v027.py tests/test_log_product_p3d_legacy_replay_v027.py \
            tests/test_log_product_p3e_merge_v027.py

  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Run unchanged P2 on seven prior-only historical dates
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          IDX=$(python - <<'PY'
          import os
          s=int(os.environ['SHARD'])
          a=list(range(300,2497,64))[s::5]
          assert len(a)==7
          print(','.join(map(str,a)))
          PY
          )
          python -m lotto7x7.log_product_p3d_legacy_replay_v027 \
            --csv-dir data/csv --indices "$IDX" \
            --out "/tmp/p3e_shard_$SHARD.json" \
            --md-out "/tmp/p3e_shard_$SHARD.md"
      - uses: actions/upload-artifact@v4
        with:
          name: p3e-shard-${{ matrix.shard }}
          path: |
            /tmp/p3e_shard_${{ matrix.shard }}.json
            /tmp/p3e_shard_${{ matrix.shard }}.md
          if-no-files-found: error

  cached:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - name: Recreate cached P3b policy decisions at exact same dates
        run: |
          python -m lotto7x7.distribution_repair_v027 --csv-dir data/csv --cutoff 2026-11-06 --out /tmp/s0.json --md-out /tmp/s0.md
          python -m lotto7x7.distribution_repair_scoring_v027 --p0 /tmp/s0.json --out /tmp/s1.json --md-out /tmp/s1.md
          python -m lotto7x7.log_product_v027 --csv-dir data/csv --cutoff 2026-11-06 --out /tmp/l0.json --md-out /tmp/l0.md
          python -m lotto7x7.log_product_dual_scoring_v027 --sum-p1 /tmp/s1.json --log-p0 /tmp/l0.json --out /tmp/d1.json --md-out /tmp/d1.md
          python -m lotto7x7.log_product_p3b_pilot_v027 \
            --sum-p1 /tmp/s1.json --log-p0 /tmp/l0.json --dual-p1 /tmp/d1.json \
            --csv-dir data/csv --cutoff 2026-11-06 \
            --warmup 300 --stride 64 --replicates 8 --seed 649 \
            --per-cell 32 --restarts 12 --cell-limit 24 \
            --out /tmp/p3b_comparison.json --md-out /tmp/p3b_comparison.md
      - uses: actions/upload-artifact@v4
        with:
          name: p3e-cached-reference
          path: /tmp/p3b_comparison.json
          if-no-files-found: error

  merge:
    needs: [tests, shards, cached]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: p3e-shard-*
          path: /tmp/shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: p3e-cached-reference
          path: /tmp/cached
      - name: Merge and independently re-audit exact 35 P2 original outcomes
        run: |
          python -m lotto7x7.log_product_p3e_merge_v027 \
            --shard /tmp/shards/p3e_shard_0.json \
            --shard /tmp/shards/p3e_shard_1.json \
            --shard /tmp/shards/p3e_shard_2.json \
            --shard /tmp/shards/p3e_shard_3.json \
            --shard /tmp/shards/p3e_shard_4.json \
            --cached-p3b /tmp/cached/p3b_comparison.json \
            --out /tmp/v027_p3e_35.json --md-out /tmp/v027_p3e_35.md
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/v027_p3e_35.json').read_text())
          assert r['schema']=='lotto7x7.log_product.v0.27.p3e_full_replay'
          assert r['checkpoint_indices']==list(range(300,2497,64))
          assert r['checkpoint_count']==35
          assert r['source']['analysis_input_sha256']=='d865e1d241b607488e58a00b22fb595734f804595afd9d8850718808d6e8b7f8'
          assert r['original_optimizer']=='lotto7x7.log_product_dual_portfolio_v027.optimize'
          assert abs(r['exact_fair_any_award_probability']-.1227314589619088)<1e-12
          assert r['matched_p3b_cached_comparison'] is not None
          for name in ('primary','distinct_sums','random'):
              d=r['empirical'][name]
              assert d['selected']+d['failures']==35
          assert 'PREDICTIVE' in r['decision']
          print('[PASS] all 35 original P2 history-only predictions, official award parity and cached matched-date audit')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v027-p3e-original-p2-35-checkpoints-2026-11-06
          path: |
            /tmp/v027_p3e_35.json
            /tmp/v027_p3e_35.md
          if-no-files-found: error
