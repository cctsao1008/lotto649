name: v0.31 H2 Incremental Geometry Proper Scores

on:
  push:
    paths:
      - 'research/lotto7x7/geometry/incremental_geometry_v031.py'
      - 'research/tests/geometry/test_incremental_geometry_v031.py'
      - 'research/lotto7x7/experiment_runner.py'
      - 'research/experiments/configs/v031-h2-geometry-ci.json'
      - 'research/experiments/ledger_registry_v1.json'
      - 'research/docs/studies/geometry/incremental_geometry_v031_h2.md'
      - '.github/workflows/incremental_geometry_v031_h2.yml'
  workflow_dispatch:

jobs:
  h2-ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python requirements
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - name: H2 frozen ablation regressions
        run: |
          mkdir -p results
          python -m unittest discover -s research/tests -p 'test_incremental_geometry_v031.py' -v
      - name: Source-audited real-history H2 pilot
        run: |
          python -m lotto7x7.experiment_runner v031-h2-geometry-ci --out results/v031_h2_ci_pilot.json
          git diff --exit-code
      - name: Publish research-only report
        uses: actions/upload-artifact@v4
        with:
          name: v031-h2-incremental-geometry-audit
          path: results/v031_h2_ci_pilot.json
          retention-days: 30
