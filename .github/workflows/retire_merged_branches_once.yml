name: One-time merged branch retirement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire_merged_branches_once.yml

permissions:
  contents: write

jobs:
  retire:
    if: github.repository == 'cctsao1008/lotto649' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retire only the 41 reviewed branch heads after checking ancestry
        run: |
          python - <<'PYRUN'
          import json
          import os
          import subprocess

          def git(*args):
              return subprocess.check_output(["git", *args], text=True)

          expected = json.loads(r"""{"refs/heads/baseline/image-learning-v02": "0102c561530522dd0abae4fd4aa0b8fccef81a9e", "refs/heads/feature/bin-dataset-v1": "323f91ec7a8ff28258c427eab2c4d7117a8f84d7", "refs/heads/feature/bin-image-dataset-v2": "825ae96f900f1bbfe6994ad23ead378fc31d59e3", "refs/heads/feature/cuda-loss-study": "a17f4b43eb59d3eb31167b0239fa44ef03616498", "refs/heads/feature/image-diagnostics-v02": "0102c561530522dd0abae4fd4aa0b8fccef81a9e", "refs/heads/feature/image-loss-alignment-v03": "c44631010967770ec7a9bccd5e3707abea4fc0a1", "refs/heads/feature/image-structure-temporal-v05": "a792a36739618488c89b47fd7b345e9ca6ca6ffc", "refs/heads/feature/lotto7x7-p0-gaussian-validation-batch1-20261108": "46d5179626b77c5f39e5fca91a6cc5516fa4baf8", "refs/heads/feature/lotto7x7-p1-shape-catalog-exact-universe-20261108": "dedcee86412a98076fc54d80c7607e0a8a5f3724", "refs/heads/feature/lotto7x7-p2-walkforward-explorer-20261108": "8b1e10f1c6cabc7b87ac16d6672527bd41842978", "refs/heads/feature/lotto7x7-v010-gpu-deep-feature-20261108": "f3a20931b65d8ae277cffb170bb75e5a359bc265", "refs/heads/feature/lotto7x7-v011-image-classification-20261108": "9732ba96a31b3dd0bfe09fb7c476027c29bb7378", "refs/heads/feature/lotto7x7-v012-natural-clustering-20261108": "2891a5f6fb67de9dc7bb94023e03d1dfb01afa8e", "refs/heads/feature/lotto7x7-v013-gpu-pairwise-similarity-20261108": "a28ff9e91375ff8338da52ab26d6e816922a1916", "refs/heads/feature/lotto7x7-v014-gaussian-shape-20261108": "9a8dd4370bd9bde16324077cbf711b6123987fcb", "refs/heads/feature/lotto7x7-v019-prospective-validation-20261108": "6f7a1513c303d1dfbaf12677de231fc762f12b48", "refs/heads/feature/lotto7x7-v020-predraw-commitment-20261108": "c24f2f17d12711bf97d4a2550567b9b195ec406c", "refs/heads/feature/lotto7x7-v021-unified-selection-20261108": "5ffc209c64163111fe34f279b2ccc82e3c80bd2a", "refs/heads/feature/lotto7x7-v022-timed-historical-hit-benchmark": "6e13b7e4ba68752c6a70868f3e7050ebfcb089bc", "refs/heads/feature/lotto7x7-v0222-unlimited-fast-ctrlc": "eda63972cef20eccf06b77d87cae101ec8dacfe0", "refs/heads/feature/lotto7x7-v023-early-hit-holdout": "39f3c271b9c015793a5a97cee9a0e44dd70f76c0", "refs/heads/feature/lotto7x7-v024-temporal-P0-P5": "4cd76e25911dbc2dae17a7a40db523d50b4e3e91", "refs/heads/feature/lotto7x7-v06-phase2-3-20261108": "157ba2265a2ed3bf3ae2390cb51f555fb6e8d756", "refs/heads/feature/lotto7x7-v07-baselines-shadow-20261108": "db470215e3f7b8180bb1f3b2e2b7094d731b0504", "refs/heads/feature/lotto7x7-v071-statistical-robustness-20261108": "4f4c98ad38ef05106485257d1edc32e3025b4494", "refs/heads/feature/lotto7x7-v072-full-history-gpu-20261108": "d40b1600d2f9fbb721eebe6724ce26bc2df50e32", "refs/heads/feature/lotto7x7-v073-full-history-audit-20261108": "9c361f4b9d427919e160ada7fb2d20a4aea578ac", "refs/heads/feature/lotto7x7-v08-gpu-probability-20261108": "4d95e4120fa9bcc452216bd846840315c593b964", "refs/heads/feature/lotto7x7-v081-prediction-stat-audit-20261108": "c9dc3018621e8c3e14975ce58f28fb1e97652a50", "refs/heads/feature/lotto7x7-v09-gpu-periodicity-discovery-20261108": "6f0bcd8690e8193d43640849e4f954e9674533c7", "refs/heads/feature/phase7-image-representation": "4cefe84f05c6d1d61c49ed8a935715580d960e82", "refs/heads/feature/phase7b-pattern-similarity": "f5a401aa2d4c19c9e4678fd327f8320e6c135be8", "refs/heads/feature/phase7c-temporal-patterns": "fd51ca94fe0fbf0a7498e9be10dc6b96d1302f26", "refs/heads/feature/predictability-audit-v04": "cb38e4e8fa6c1b3d3d490516f013c598eb4f4ca9", "refs/heads/feature/shape-pool-v06-phase1": "f80645836000f343ea275bd6517332974cb280f5", "refs/heads/feature/visual-image-dynamics-v051": "ddb7a049932473e2654607d80f81185e8341ddc4", "refs/heads/fix/cuda-device-index-comparison": "ffe32c4bc7407c8c1b297a40af72108a8d7a58cf", "refs/heads/fix/lotto649-csv-verify-windows-crlf": "25a757cc2087a941994d415b8bc8b0d71bf5d299", "refs/heads/fix/v0221-quiet-total-10000-pacing": "7d293b180799c21c9702c9359b34c421fef6fe22", "refs/heads/rebuild/lotto7x7-image-learning": "bbb2af8d92787965c8aced2aacc58994266e3860", "refs/heads/research/v025-covariance-matched": "c8039120e780862c1a25182cfdc6be6b922d4d77"}""")
          assert "refs/heads/main" not in expected
          seen = dict(line.split()[::-1] for line in git("ls-remote", "--heads", "origin").splitlines())
          main = seen.pop("refs/heads/main")
          if main != os.environ["GITHUB_SHA"] or main != git("rev-parse", "HEAD").strip():
              raise SystemExit("main changed after the reviewed workflow started")
          if seen != expected:
              changed = sorted(ref for ref in (seen.keys() | expected.keys())
                               if seen.get(ref) != expected.get(ref))
              raise SystemExit("Branch inventory changed: " + ", ".join(changed))
          for ref, sha in expected.items():
              subprocess.run(["git", "merge-base", "--is-ancestor", sha, main], check=True)
              print(f"Verified {ref}: {sha} is reachable from main", flush=True)

          leases = [f"--force-with-lease={ref}:{sha}" for ref, sha in expected.items()]
          deletions = [f":{ref}" for ref in expected]
          subprocess.run(["git", "push", "--atomic", *leases, "origin", *deletions], check=True)
          remaining = dict(line.split()[::-1] for line in git("ls-remote", "--heads", "origin").splitlines())
          if remaining != {"refs/heads/main": main}:
              raise SystemExit("Unexpected branch inventory after retirement")
          print(f"Verified: main is the only remote branch. Retired {len(expected)} refs.")
          PYRUN
