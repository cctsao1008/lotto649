name: Lotto649 v0.26 Independent Burnside Four-Ticket Structure Proof

on:
  push:
    branches: [main]
    paths:
      - 'lotto7x7/coverage_burnside_v026.py'
      - 'tests/test_coverage_burnside_v026.py'
      - 'docs/coverage_burnside_independent_v026.md'
      - '.github/workflows/coverage_burnside_v026.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent group-theory and DP adversarial tests
        run: python -m unittest discover -s tests -p 'test_coverage_burnside_v026.py' -v
      - name: Full independent Burnside certificate
        run: |
          mkdir -p results
          python -m lotto7x7.coverage_burnside_v026 --out results/v026_burnside_independent.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/v026_burnside_independent.json').read_text(encoding='utf-8'))
          assert r['total_nonnegative_labeled_mask_structures']==52450
          assert r['distinct_ticket_labeled_mask_structures']==50985
          assert r['duplicate_ticket_labeled_mask_structures']==1465
          assert r['burnside_fixed_point_numerator']==70968
          assert r['unlabeled_valid_membership_structures']==2957
          assert r['independent_structural_count_agrees']
          assert r['scientific_decision']=='EXACT_STRUCTURE_ONLY_NO_PREDICTIVE_INFERENCE'
          print('PASS: 2957 independent orbits; no lottery forecast inferred')
          PY
          git diff --exit-code
      - name: Archive exact nonforecast counting certificate
        uses: actions/upload-artifact@v4
        with:
          name: v026-burnside-independent-structural-certificate
          path: results/v026_burnside_independent.json
          retention-days: 30
